name: larpardy

services:
  server:
    profiles:
      - prod
    depends_on:
      - redis
    build:
      context: .
      target: server
    env_file:
      - ".env"
    environment:
      - REDIS_URL=redis://redis
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    ports:
      - "3001:3001"
    restart: unless-stopped

  redis:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass "${REDIS_PASS:?error}" --appendonly yes --save 900 1 --save 300 10 --save 60 1000
    restart: unless-stopped

  postgres:
    image: postgres:18
    profiles:
      - dev
    volumes:
      - larpardy-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  larpardy-postgres-data:
    driver: local
